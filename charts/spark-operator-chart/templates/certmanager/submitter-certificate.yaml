{{- if .Values.submitter.enable }}
{{- if .Values.submitter.tls.enabled }}
{{- if .Values.certManager.enable }}
{{- if not (.Capabilities.APIVersions.Has "cert-manager.io/v1/Certificate") }}
{{- fail "The cluster does not support the required API version `cert-manager.io/v1` for `Certificate`." }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "spark-operator.certManager.submitter.certificate.name" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-operator.submitter.labels" . | nindent 4 }}
spec:
  isCA: true
  secretName: {{ include "spark-operator.submitter.tls.secretName" . }}-ca
  issuerRef:
    {{- if not .Values.certManager.issuerRef }}
    group: cert-manager.io
    kind: Issuer
    name: {{ include "spark-operator.certManager.issuer.name" . }}
    {{- else }}
    {{- toYaml .Values.certManager.issuerRef | nindent 4 }}
    {{- end }}
  commonName: spark-operator-submitter-ca
  privateKey:
    encoding: PKCS8
  {{- with .Values.certManager.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with .Values.certManager.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "spark-operator.submitter.name" . }}-ca-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-operator.submitter.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "spark-operator.submitter.tls.secretName" . }}-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "spark-operator.certManager.submitter.certificate.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-operator.submitter.labels" . | nindent 4 }}
spec:
  secretName: {{ include "spark-operator.submitter.tls.secretName" . }}
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ include "spark-operator.submitter.name" . }}-ca-issuer
  commonName: {{ include "spark-operator.submitter.serviceName" . }}.{{ .Release.Namespace }}.svc
  dnsNames:
  - {{ include "spark-operator.submitter.serviceName" . }}.{{ .Release.Namespace }}.svc
  - {{ include "spark-operator.submitter.serviceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  subject:
    organizationalUnits:
     - spark-operator
  privateKey:
    encoding: PKCS8
  usages:
  - server auth
  - client auth
  {{- with .Values.certManager.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with .Values.certManager.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
